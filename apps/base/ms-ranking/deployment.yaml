apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-ranking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-ranking
  template:
    metadata:
      labels:
        app: ms-ranking
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-login
      initContainers:
        - name: wait-for-db
          image: busybox:1.28
          command: ['sh', '-c', "until nc -zv ms-ranking-db-postgresql 5432; do echo waiting for postgres; sleep 2; done"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              cpu: 50m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi
        - name: run-migrations
          image: ghcr.io/volontariapp/ms-ranking:sha-e495ff7
          imagePullPolicy: Always
          command: ['node', 'node_modules/typeorm/cli.js', 'migration:run', '-d', 'dist/config/data-source.js']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: NODE_ENV
              value: "production"
            - name: DB_HOST
              value: "ms-ranking-db-postgresql"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "ms-ranking"
            - name: DB_USERNAME
              value: "ms-ranking"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: ms-ranking-password
            # Requise par la validation de la config chargee par data-source.js
            - name: RANKING_LOCATION_KEY
              valueFrom:
                secretKeyRef:
                  name: ranking-secrets
                  key: RANKING_LOCATION_KEY
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      containers:
        - name: ms-ranking
          image: ghcr.io/volontariapp/ms-ranking:sha-e495ff7
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1001
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 3007
              name: http
          env:
            - name: OTEL_SDK_DISABLED
              value: "false"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://datadog-agent-install.datadog.svc.cluster.local:4317"
            - name: DD_ENV
              value: "prod"
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3007"
            - name: DB_HOST
              value: "ms-ranking-db-postgresql"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "ms-ranking"
            - name: DB_USERNAME
              value: "ms-ranking"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: ms-ranking-password
            # Les clients gRPC vers les autres domaines : sans ces variables la config retombe sur localhost
            - name: MS_USER_URL
              value: "ms-user:80"
            - name: MS_POST_URL
              value: "ms-post:80"
            - name: MS_EVENT_URL
              value: "ms-event:80"
            - name: MS_SOCIAL_URL
              value: "ms-social:80"
            - name: MS_WS_URL
              value: "ws-service:80"
            # Adresse d'ecoute gRPC de ms-ranking (le Service redirige le port 80 vers 3000)
            - name: MS_RANKING_URL
              value: "0.0.0.0:3000"
            # Cle de 32 octets aleatoires pour chiffrer la position (secret scelle ranking-secrets)
            - name: RANKING_LOCATION_KEY
              valueFrom:
                secretKeyRef:
                  name: ranking-secrets
                  key: RANKING_LOCATION_KEY
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
            - name: certs-volume
              mountPath: /app/certs
              readOnly: true
      volumes:
        - name: certs-volume
          secret:
            secretName: auth-certs
        - name: tmp-volume
          emptyDir: {}
