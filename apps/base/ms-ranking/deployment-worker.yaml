apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-ranking
  labels:
    app: worker-ranking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-ranking
  template:
    metadata:
      labels:
        app: worker-ranking
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-login
      initContainers:
        - name: wait-for-db
          image: busybox:1.28
          command: ['sh', '-c', "until nc -zv ms-ranking-db-postgresql 5432; do echo waiting for db; sleep 2; done"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              cpu: 50m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi
        - name: wait-for-redis
          image: busybox:1.28
          command: ['sh', '-c', "until nc -zv redis-master 6379; do echo waiting for redis; sleep 2; done"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              cpu: 50m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi
      containers:
        - name: worker-ranking
          image: ghcr.io/volontariapp/worker-ranking:sha-cf855c8
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1001
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 4107
              name: http
          env:
            - name: OTEL_SDK_DISABLED
              value: "false"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://datadog-agent-install.datadog.svc.cluster.local:4317"
            - name: DD_ENV
              value: "prod"
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "4107"
            - name: DB_HOST
              value: "ms-ranking-db-postgresql"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "ms-ranking"
            - name: DB_USERNAME
              value: "ms-ranking"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: ms-ranking-password
            - name: REDIS_HOST
              value: "redis-master"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: redis-password
            # Clients gRPC du worker : candidats et historique (ms-social, ms-event, ms-post)
            - name: MS_SOCIAL_URL
              value: "ms-social:80"
            - name: MS_EVENT_URL
              value: "ms-event:80"
            - name: MS_POST_URL
              value: "ms-post:80"
            - name: RANKING_LOCATION_KEY
              valueFrom:
                secretKeyRef:
                  name: ranking-secrets
                  key: RANKING_LOCATION_KEY
            # Cle Jev (api.typesafe.ai) : le scoreur n'est pas encore branche, donc optionnelle
            - name: TYPESAFE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ranking-secrets
                  key: TYPESAFE_API_KEY
                  optional: true
          resources:
            limits:
              cpu: 50m
              memory: 320Mi
            requests:
              cpu: 10m
              memory: 128Mi
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
            - name: certs-volume
              mountPath: /app/certs
              readOnly: true
      volumes:
        - name: certs-volume
          secret:
            secretName: auth-certs
        - name: tmp-volume
          emptyDir: {}
