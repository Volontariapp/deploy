apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-meta-indexer-policy
spec:
  podSelector:
    matchLabels:
      app: mcp-meta-indexer
  policyTypes:
    - Egress
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 3000
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
