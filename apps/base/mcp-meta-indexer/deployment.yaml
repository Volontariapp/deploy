apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-meta-indexer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-meta-indexer
  template:
    metadata:
      labels:
        app: mcp-meta-indexer
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-login
      containers:
        - name: git-sync
          image: registry.k8s.io/git-sync/git-sync:v4.2.1
          args:
            - --repo=https://github.com/Volontariapp/deploy.git
            - --branch=main
            - --depth=1
            - --wait=60
            - --root=/code
            - --submodules=recursive
          env:
            - name: GITSYNC_USERNAME
              value: "x-access-token"
            - name: GITSYNC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: git-creds
                  key: password
          securityContext:
            runAsUser: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: code-volume
              mountPath: /code
        - name: mcp-meta-indexer
          image: ghcr.io/volontariapp/mcp-meta-indexer:sha-4e69c24
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: MCP_TRANSPORT
              value: "sse"
          workingDir: /code/deploy
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: code-volume
              mountPath: /code
      volumes:
        - name: code-volume
          emptyDir: {}
