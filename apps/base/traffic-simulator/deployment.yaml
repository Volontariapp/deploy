apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-simulator
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: traffic-simulator
  template:
    metadata:
      labels:
        app: traffic-simulator
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-login
      containers:
        - name: traffic-simulator
          image: ghcr.io/volontariapp/traffic-simulator:sha-3124e1c
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1001
            readOnlyRootFilesystem: true
          env:
            - name: NODE_ENV
              value: "production"
            - name: API_GATEWAY_URL
              value: "http://api-gateway"
            - name: TICK_INTERVAL_MS
              value: "8000"
            - name: EVENT_LIFESPAN_SEC
              value: "180"
            # Cible : environ 1000 utilisateurs simultanes. 1500 comptes dont un millier actifs en continu,
            # 200 acteurs locaux, graphe de follow, activite de fond et rafales (voir README du simulateur)
            - name: TARGET_ACTORS
              value: "1500"
            - name: EVENTS_PER_DISTRICT
              value: "3"
            - name: PARALLEL_DISTRICT_BATCH
              value: "4"
            - name: INITIAL_MASS_SEED
              value: "false"
            - name: MASS_EVENTS_COUNT
              value: "100"
            - name: ACTOR_BATCH_PAUSE_MS
              value: "1000"
            - name: POST_SCAN_INTERVAL_MS
              value: "4000"
            - name: REACTION_TICK_MS
              value: "1000"
            - name: POST_LIKES_MIN
              value: "25"
            - name: POST_LIKES_MAX
              value: "80"
            - name: POST_COMMENTS_MIN
              value: "6"
            - name: POST_COMMENTS_MAX
              value: "15"
            # Graphe de follow entre acteurs (environ 34 000 liens, ecrits en arriere-plan au premier demarrage)
            - name: SOCIAL_FOLLOWS_MIN
              value: "5"
            - name: SOCIAL_FOLLOWS_MAX
              value: "30"
            - name: SOCIAL_FOLLOW_CONCURRENCY
              value: "10"
            - name: SOCIAL_FOLLOW_PAUSE_MS
              value: "500"
            # Activite de fond sur les posts des simulateurs, plus une rafale de 1000 actions toutes les 30 min
            # (appels simultanes plafonnes a 250). Retirer AMBIENT_BURST_SIZE pour couper les pics.
            - name: AMBIENT_ACTIONS_PER_SEC
              value: "20"
            - name: AMBIENT_COMMENT_PERCENT
              value: "15"
            - name: AMBIENT_BURST_SIZE
              value: "1000"
            - name: AMBIENT_BURST_INTERVAL_MIN
              value: "30"
            - name: AMBIENT_MAX_CONCURRENCY
              value: "250"
            # Quelques acteurs suivent chaque vrai compte (liste admin, comptes existants inclus)
            - name: REAL_FOLLOWERS_MIN
              value: "6"
            - name: REAL_FOLLOWERS_MAX
              value: "15"
            # Evenements autour des vrais utilisateurs : le simulateur lit leurs positions (cellules de 1 km,
            # anonymes) avec ce compte ADMIN dedie, secret scelle traffic-simulator-admin
            - name: SIMULATOR_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: traffic-simulator-admin
                  key: email
            - name: SIMULATOR_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: traffic-simulator-admin
                  key: password
            - name: LOCAL_ACTORS
              value: "200"
            - name: LOCAL_RADIUS_METERS
              value: "2000"
            - name: LOCAL_EVENTS_INTERVAL_SEC
              value: "300"
            # Fenetre de sommeil : aucun trafic entre minuit et 8h (heure de Paris)
            - name: SLEEP_ENABLED
              value: "true"
            - name: SLEEP_START_HOUR
              value: "0"
            - name: SLEEP_END_HOUR
              value: "8"
            - name: SLEEP_TIMEZONE
              value: "Europe/Paris"
            - name: SLEEP_DRAIN_SEC
              value: "300"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

