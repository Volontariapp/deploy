apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-simulator
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: traffic-simulator
  template:
    metadata:
      labels:
        app: traffic-simulator
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-login
      containers:
        - name: traffic-simulator
          image: ghcr.io/volontariapp/traffic-simulator:sha-81c5b9b
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1001
            readOnlyRootFilesystem: true
          env:
            - name: NODE_ENV
              value: "production"
            - name: API_GATEWAY_URL
              value: "http://api-gateway"
            - name: TICK_INTERVAL_MS
              value: "8000"
            - name: EVENT_LIFESPAN_SEC
              value: "180"
            - name: TARGET_ACTORS
              value: "120"
            - name: EVENTS_PER_DISTRICT
              value: "3"
            - name: PARALLEL_DISTRICT_BATCH
              value: "4"
            - name: INITIAL_MASS_SEED
              value: "false"
            - name: MASS_EVENTS_COUNT
              value: "100"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 384Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

