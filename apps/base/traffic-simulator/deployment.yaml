apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-simulator
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: traffic-simulator
  template:
    metadata:
      labels:
        app: traffic-simulator
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-login
      containers:
        - name: traffic-simulator
          image: ghcr.io/volontariapp/traffic-simulator:sha-19efbf4
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1001
            readOnlyRootFilesystem: true
          env:
            - name: NODE_ENV
              value: "production"
            - name: API_GATEWAY_URL
              value: "http://api-gateway"
            - name: TICK_INTERVAL_MS
              value: "8000"
            - name: EVENT_LIFESPAN_SEC
              value: "180"
            - name: TARGET_ACTORS
              value: "300"
            - name: EVENTS_PER_DISTRICT
              value: "3"
            - name: PARALLEL_DISTRICT_BATCH
              value: "4"
            - name: INITIAL_MASS_SEED
              value: "false"
            - name: MASS_EVENTS_COUNT
              value: "100"
            - name: ACTOR_BATCH_PAUSE_MS
              value: "1000"
            - name: POST_SCAN_INTERVAL_MS
              value: "4000"
            - name: REACTION_TICK_MS
              value: "1000"
            - name: POST_LIKES_MIN
              value: "12"
            - name: POST_LIKES_MAX
              value: "25"
            - name: POST_COMMENTS_MIN
              value: "4"
            - name: POST_COMMENTS_MAX
              value: "8"
            # Evenements autour des vrais utilisateurs : le simulateur lit leurs positions (cellules de 1 km,
            # anonymes) avec ce compte ADMIN dedie, secret scelle traffic-simulator-admin
            - name: SIMULATOR_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: traffic-simulator-admin
                  key: email
            - name: SIMULATOR_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: traffic-simulator-admin
                  key: password
            - name: LOCAL_ACTORS
              value: "40"
            - name: LOCAL_RADIUS_METERS
              value: "2000"
            - name: LOCAL_EVENTS_INTERVAL_SEC
              value: "300"
            # Fenetre de sommeil : aucun trafic entre minuit et 8h (heure de Paris)
            - name: SLEEP_ENABLED
              value: "true"
            - name: SLEEP_START_HOUR
              value: "0"
            - name: SLEEP_END_HOUR
              value: "8"
            - name: SLEEP_TIMEZONE
              value: "Europe/Paris"
            - name: SLEEP_DRAIN_SEC
              value: "300"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 384Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

