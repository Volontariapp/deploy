apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  # replicas absent : piloté par l'HPA (hpa.yaml, minReplicas 3). Le fixer ici ferait
  # entrer ArgoCD en conflit avec l'autoscaler à chaque sync.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: api-gateway
      imagePullSecrets:
        - name: ghcr-login
      containers:
        - name: api-gateway
          image: ghcr.io/volontariapp/api-gateway:sha-c7be5b5
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1001
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: OTEL_SDK_DISABLED
              value: "false"
            - name: OTEL_TRACES_SAMPLER
              value: "parentbased_traceidratio"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            # Instrumentations sans valeur de diagnostic coupees : environ 15 des 20 spans par requete
            # (express, router), et un cout CPU de 11 a 14 % au profil du 2026-11-09. Les spans HTTP,
            # gRPC, pg, Redis et Neo4j restent. Docs montee-en-charge, analyses-services, vague 1.
            - name: OTEL_NODE_DISABLED_INSTRUMENTATIONS
              value: "express,router,nestjs-core,net,undici,generic-pool"
            # Zone des objets de courte duree agrandie : moins de passages du ramasse-miettes
            # (13 a 15 % du temps occupe au profil du 2026-11-09). Docs montee-en-charge, chapitre 05, phase B.
            - name: NODE_OPTIONS
              value: "--max-semi-space-size=16"
            - name: LOGGER_LEVEL
              value: "info"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://datadog-agent-install.datadog.svc.cluster.local:4317"
            - name: DD_ENV
              value: "prod"
            - name: NODE_ENV
              value: "production"
            - name: MS_USER_URL
              value: "ms-user-headless:3000"
            - name: MS_POST_URL
              value: "ms-post-headless:3000"
            - name: MS_SOCIAL_URL
              value: "ms-social-headless:3000"
            - name: MS_EVENT_URL
              value: "ms-event-headless:3000"
            - name: MS_STORAGE_URL
              value: "ms-storage:80"
            - name: S3_PUBLIC_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: storage-public-config
                  key: S3_PUBLIC_BASE_URL
                  optional: true
            - name: MS_WS_URL
              value: "ws-service:80"
            - name: MS_RANKING_URL
              value: "ms-ranking:80"
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 2000m
              # 188 a 198 Mi mesures a 225 req/s avec --max-semi-space-size=16 : marge pour 300 req/s.
              memory: 320Mi
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
            - name: certs-volume
              mountPath: /app/certs
              readOnly: true
      volumes:
        - name: certs-volume
          secret:
            secretName: auth-certs
        - name: tmp-volume
          emptyDir: {}
