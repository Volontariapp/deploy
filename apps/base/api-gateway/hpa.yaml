apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  # 5 pods chauds au repos : un pod neuf ajoute en plein palier recoit sa part du trafic
  # avant d'etre optimise (JIT, connexions gRPC), voir docs montee-en-charge 02 section 4.
  minReplicas: 5
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          # Valeur absolue : un pourcentage de la requete (100m) se declenchait a 70m, soit des
          # pods quasi inactifs (limite 2000m) et un HPA colle au maximum sous toute charge.
          type: AverageValue
          averageValue: 500m
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        # Un pod par minute : jamais deux pods froids en meme temps.
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
