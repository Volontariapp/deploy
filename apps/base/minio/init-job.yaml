# Initialise les buckets, la politique anonyme, le lifecycle et l'utilisateur applicatif.
# Rejoue a chaque sync ArgoCD (hook PostSync) : toutes les commandes sont idempotentes.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  labels:
    app: minio-init
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: minio-init
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mc
          # Meme image que le service minio-init de ci-tools/docker-compose.yml
          image: cgr.dev/chainguard/minio-client@sha256:f0dd93b48af1f8a641edcd3c64661c8dbe05189bd2ef2f8cea216eb18af10bf8
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              export MC_CONFIG_DIR=/tmp/.mc
              until mc alias set minio http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                echo "waiting for minio"; sleep 2
              done

              mc mb --ignore-existing minio/volontariapp-public
              mc mb --ignore-existing minio/volontariapp-private

              # Bucket public : lecture anonyme d'objets uniquement (pas de s3:ListBucket, donc pas de listing)
              cat > /tmp/public-policy.json <<'POLICY'
              {
                "Version": "2012-10-17",
                "Statement": [
                  {
                    "Effect": "Allow",
                    "Principal": {"AWS": ["*"]},
                    "Action": ["s3:GetObject"],
                    "Resource": ["arn:aws:s3:::volontariapp-public/*"]
                  }
                ]
              }
              POLICY
              mc anonymous set-json /tmp/public-policy.json minio/volontariapp-public

              # Filet de securite : les objets en quarantaine expirent apres 1 jour
              mc ilm rule list minio/volontariapp-private | grep -q "quarantine/" || \
                mc ilm rule add --prefix "quarantine/" --expire-days 1 minio/volontariapp-private

              # Utilisateur applicatif a droits limites aux deux buckets (moindre privilege).
              # s3:ListBucket est requis : sans lui, un HeadObject sur une cle absente renvoie 403 au lieu de 404.
              cat > /tmp/ms-storage-policy.json <<'POLICY'
              {
                "Version": "2012-10-17",
                "Statement": [
                  {
                    "Effect": "Allow",
                    "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject"],
                    "Resource": [
                      "arn:aws:s3:::volontariapp-public/*",
                      "arn:aws:s3:::volontariapp-private/*"
                    ]
                  },
                  {
                    "Effect": "Allow",
                    "Action": ["s3:ListBucket", "s3:GetBucketLocation"],
                    "Resource": [
                      "arn:aws:s3:::volontariapp-public",
                      "arn:aws:s3:::volontariapp-private"
                    ]
                  }
                ]
              }
              POLICY
              mc admin policy create minio ms-storage-policy /tmp/ms-storage-policy.json
              mc admin user add minio "$S3_ACCESS_KEY" "$S3_SECRET_KEY"
              mc admin policy attach minio ms-storage-policy --user "$S3_ACCESS_KEY"

              echo "minio initialised"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_PASSWORD
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: S3_SECRET_KEY
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
