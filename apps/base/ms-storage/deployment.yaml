apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-storage
  template:
    metadata:
      labels:
        app: ms-storage
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-login
      initContainers:
        - name: wait-for-db
          image: busybox:1.28
          command: ['sh', '-c', "until nc -zv ms-storage-db-postgresql 5432; do echo waiting for postgres; sleep 2; done"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              cpu: 50m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi
        - name: run-migrations
          image: ghcr.io/volontariapp/ms-storage:sha-3555f39
          imagePullPolicy: Always
          command: ['node', 'node_modules/typeorm/cli.js', 'migration:run', '-d', 'dist/config/data-source.js']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: NODE_ENV
              value: "production"
            - name: DB_HOST
              value: "ms-storage-db-postgresql"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "ms-storage"
            - name: DB_USERNAME
              value: "ms-storage"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: ms-storage-password
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
        - name: wait-for-redis
          image: busybox:1.28
          command: ['sh', '-c', "until nc -zv redis-master 6379; do echo waiting for redis; sleep 2; done"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              cpu: 50m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi
      containers:
        - name: ms-storage
          image: ghcr.io/volontariapp/ms-storage:sha-3555f39
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1001
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 3001
              name: http
          env:
            - name: OTEL_SDK_DISABLED
              value: "false"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://datadog-agent-install.datadog.svc.cluster.local:4317"
            - name: DD_ENV
              value: "prod"
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3001"
            - name: DB_HOST
              value: "ms-storage-db-postgresql"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "ms-storage"
            - name: DB_USERNAME
              value: "ms-storage"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: ms-storage-password
            # Adresse d'ecoute gRPC de ms-storage (le Service redirige le port 80 vers 3000)
            - name: MS_STORAGE_URL
              value: "0.0.0.0:3000"
            - name: MS_USER_URL
              value: "ms-user:80"
            - name: MS_POST_URL
              value: "ms-post:80"
            - name: MS_EVENT_URL
              value: "ms-event:80"
            - name: MS_SOCIAL_URL
              value: "ms-social:80"
            # Stockage objet (MinIO du cluster) : endpoint interne pour les appels, endpoint public pour signer
            - name: S3_ENDPOINT
              value: "http://minio:9000"
            - name: S3_REGION
              value: "us-east-1"
            - name: S3_USE_PATH_STYLE
              value: "true"
            - name: S3_PUBLIC_BUCKET
              value: "volontariapp-public"
            - name: S3_PRIVATE_BUCKET
              value: "volontariapp-private"
            - name: S3_PUBLIC_ENDPOINT
              value: "https://s3.cyrus-ag.com"
            - name: S3_PUBLIC_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: storage-public-config
                  key: S3_PUBLIC_BASE_URL
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: S3_SECRET_KEY
            # Antivirus clamd (chemin SYNC)
            - name: SCANNER_HOST
              value: "clamd"
            - name: SCANNER_PORT
              value: "3310"
            - name: SCANNER_TIMEOUT_MS
              value: "5000"
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 300m
              memory: 512Mi
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
            - name: certs-volume
              mountPath: /app/certs
              readOnly: true
      volumes:
        - name: certs-volume
          secret:
            secretName: auth-certs
        - name: tmp-volume
          emptyDir: {}
