apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-storage
  labels:
    app: worker-storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-storage
  template:
    metadata:
      labels:
        app: worker-storage
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-login
      initContainers:
        - name: wait-for-db
          image: busybox:1.28
          command: ['sh', '-c', "until nc -zv ms-storage-db-postgresql 5432; do echo waiting for db; sleep 2; done"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              cpu: 200m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi
        - name: wait-for-redis
          image: busybox:1.28
          command: ['sh', '-c', "until nc -zv redis-master 6379; do echo waiting for redis; sleep 2; done"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              cpu: 200m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi
      containers:
        - name: worker-storage
          image: ghcr.io/volontariapp/worker-storage:sha-d3d34d1
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1001
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 4102
              name: http
          env:
            - name: OTEL_SDK_DISABLED
              value: "false"
            - name: OTEL_TRACES_SAMPLER
              value: "parentbased_traceidratio"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://datadog-agent-install.datadog.svc.cluster.local:4317"
            - name: DD_ENV
              value: "prod"
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "4102"
            - name: DB_HOST
              value: "ms-storage-db-postgresql"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "ms-storage"
            - name: DB_USERNAME
              value: "ms-storage"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: ms-storage-password
            - name: REDIS_HOST
              value: "redis-master"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: redis-password
            # Stockage objet (MinIO du cluster) : purge, publication et scan des fichiers
            - name: S3_ENDPOINT
              value: "http://minio:9000"
            - name: S3_REGION
              value: "us-east-1"
            - name: S3_USE_PATH_STYLE
              value: "true"
            - name: S3_PUBLIC_BUCKET
              value: "volontariapp-public"
            - name: S3_PRIVATE_BUCKET
              value: "volontariapp-private"
            - name: S3_PUBLIC_ENDPOINT
              value: "https://s3.cyrus-ag.com"
            - name: S3_PUBLIC_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: storage-public-config
                  key: S3_PUBLIC_BASE_URL
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: S3_SECRET_KEY
            # Antivirus clamd (scan ASYNC)
            - name: SCANNER_HOST
              value: "clamd"
            - name: SCANNER_PORT
              value: "3310"
            - name: SCANNER_TIMEOUT_MS
              value: "30000"
          resources:
            limits:
              cpu: 200m
              memory: 320Mi
            requests:
              cpu: 10m
              memory: 128Mi
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
            - name: certs-volume
              mountPath: /app/certs
              readOnly: true
      volumes:
        - name: certs-volume
          secret:
            secretName: auth-certs
        - name: tmp-volume
          emptyDir: {}
