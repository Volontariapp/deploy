apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-social
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-social
  template:
    metadata:
      labels:
        app: ms-social
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-login
      initContainers:
        - name: wait-for-db
          image: busybox:1.28
          command: ['sh', '-c', 'until nc -zv ms-social-db-postgresql 5432; do echo waiting for postgres; sleep 2; done']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              cpu: 200m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi
        - name: run-migrations
          image: ghcr.io/volontariapp/ms-social:sha-44a524f
          imagePullPolicy: Always
          command: ['node', 'node_modules/typeorm/cli.js', 'migration:run', '-d', 'dist/config/data-source.js']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: NODE_ENV
              value: "production"
            - name: DB_HOST
              value: "ms-social-db-postgresql"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "ms-social"
            - name: DB_USERNAME
              value: "ms-social"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: ms-social-password
            - name: NEO4J_HOST
              value: 'neo4j'
            - name: NEO4J_PORT
              value: '7687'
            - name: NEO4J_USERNAME
              value: 'neo4j'
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: neo4j-password
          resources:
            limits:
              cpu: 400m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
        - name: wait-for-neo4j
          image: busybox:1.28
          command: ['sh', '-c', 'until nc -zv neo4j 7687; do echo waiting for neo4j; sleep 2; done']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              cpu: 200m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi
      containers:
        - name: ms-social
          image: ghcr.io/volontariapp/ms-social:sha-44a524f
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
            runAsNonRoot: true
            runAsUser: 1001
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 3004
              name: http
          env:
            - name: OTEL_SDK_DISABLED
              value: "false"
            - name: OTEL_TRACES_SAMPLER
              value: "parentbased_traceidratio"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            # Instrumentations sans valeur de diagnostic coupees : environ 15 des 20 spans par requete
            # (express, router), et un cout CPU de 11 a 14 % au profil du 2026-11-09. Les spans HTTP,
            # gRPC, pg, Redis et Neo4j restent. Docs montee-en-charge, analyses-services, vague 1.
            - name: OTEL_NODE_DISABLED_INSTRUMENTATIONS
              value: "express,router,nestjs-core,net,undici,generic-pool"
            # Zone des objets de courte duree agrandie : moins de passages du ramasse-miettes
            # (13 a 15 % du temps occupe au profil du 2026-11-09). Docs montee-en-charge, chapitre 05, phase B.
            - name: NODE_OPTIONS
              value: "--max-semi-space-size=32"
            - name: LOGGER_LEVEL
              value: "info"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://datadog-agent-install.datadog.svc.cluster.local:4317"
            - name: DD_ENV
              value: "prod"
            - name: NODE_ENV
              value: 'production'
            - name: PORT
              value: '3004'
            - name: DB_HOST
              value: 'ms-social-db-postgresql'
            - name: DB_PORT
              value: '5432'
            - name: DB_NAME
              value: 'ms-social'
            - name: DB_USERNAME
              value: 'ms-social'
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: ms-social-password
            - name: MS_USER_URL
              value: 'ms-user:80'
            - name: MS_POST_URL
              value: 'ms-post:80'
            - name: MS_EVENT_URL
              value: 'ms-event:80'
            - name: MS_SOCIAL_URL
              value: '0.0.0.0:3000'
            - name: NEO4J_HOST
              value: 'neo4j'
            - name: NEO4J_PORT
              value: '7687'
            - name: NEO4J_USERNAME
              value: 'neo4j'
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: neo4j-password
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          # GET /health (health-check-nest) appelle verifyConnectivity du driver Neo4j et repond 503
          # si Neo4j ne repond pas : un pod dont la connexion a echoue au demarrage (le provider
          # journalise l'erreur sans arreter le pod) ne recoit pas de trafic. Neo4j reste hors de la
          # liveness : un Neo4j lent ne doit pas faire redemarrer les pods.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              # Requete proche de l'usage sous charge (mesure a 400 req/s : 345m par pod) : sous contention
              # du noeud, la part de CPU de chaque conteneur suit sa requete. Docs montee-en-charge.
              cpu: 300m
              memory: 128Mi
            limits:
              cpu: 800m
              memory: 512Mi
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
            - name: certs-volume
              mountPath: /app/certs
              readOnly: true
      volumes:
        - name: certs-volume
          secret:
            secretName: auth-certs
        - name: tmp-volume
          emptyDir: {}
