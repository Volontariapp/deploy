apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: postgresql
    repo: https://charts.bitnami.com/bitnami
    releaseName: ms-user-db
    version: 15.5.30
    valuesInline:
      image:
        registry: docker.io
        repository: library/postgres
        tag: 16-alpine
      auth:
        database: ms-user
        username: ms-user
        existingSecret: db-secrets
        secretKeys:
          userPasswordKey: ms-user-password
      primary:
        podAnnotations:
          ad.datadoghq.com/postgresql.check_names: '["postgres"]'
          ad.datadoghq.com/postgresql.init_configs: '[{}]'
          ad.datadoghq.com/postgresql.instances: >-
            [{"host": "%%host%%", "port": "5432", "username": "%%env_POSTGRES_USER%%", "password": "%%env_POSTGRES_PASSWORD%%", "dbname": "%%env_POSTGRES_DATABASE%%"}]
        persistence:
          storageClass: local-path
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        extraVolumes:
          - name: postgresql-run
            emptyDir: {}
        extraVolumeMounts:
          - name: postgresql-run
            mountPath: /var/run/postgresql
