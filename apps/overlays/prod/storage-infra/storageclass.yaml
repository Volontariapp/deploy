# Meme provisioner que local-path (defaut du cluster), mais les volumes survivent a la
# suppression du PVC : la politique par defaut (Delete) detruirait les images.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-path-retain
provisioner: rancher.io/local-path
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
