apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Force cache invalidation v3: 2026-05-16T15:26:00Z

helmCharts:
  - name: neo4j
    repo: https://neo4j.github.io/helm-charts
    releaseName: neo4j
    version: 5.20.0
    valuesInline:
      neo4j:
        name: neo4j
        acceptLicenseAgreement: 'yes'
        edition: community
        securityContext:
          runAsNonRoot: true
          runAsUser: 7474
          fsGroup: 7474
        containerSecurityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ['ALL']
          runAsNonRoot: true
          runAsUser: 7474
          seccompProfile:
            type: RuntimeDefault
        # The chart reads neo4j.resources (not a top-level resources key, which it ignores) and
        # uses the same values for requests and limits. 2000m: at 100 req/s after 4 h without
        # traffic Neo4j averaged 742m on its former 1000m limit while every request timed out
        # (2026-11-09 21:01Z); warm, 400 req/s take 400m.
        resources:
          cpu: "2000m"
          memory: "2Gi"
      volumes:
        data:
          mode: defaultStorageClass
      services:
        default:
          enabled: true
          type: ClusterIP
        neo4j:
          enabled: true
          type: ClusterIP

patches:
  - target:
      kind: StatefulSet
      name: neo4j
    path: neo4j-security-patch.yaml
  - target:
      kind: Service
      name: neo4j-lb-neo4j
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: neo4j-lb-neo4j
      spec:
        type: ClusterIP
        externalTrafficPolicy: null
