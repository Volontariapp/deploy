apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: postgresql
    repo: https://charts.bitnami.com/bitnami
    releaseName: ms-event-db
    version: 15.5.30
    valuesInline:
      image:
        registry: docker.io
        repository: postgis/postgis
        tag: 16-3.4
      auth:
        database: ms-event
        username: ms-event
        existingSecret: db-secrets
        secretKeys:
          userPasswordKey: ms-event-password
      primary:
        # pg_stat_statements (optimisation-ecritures L0). The official postgres
        # image ignores the Bitnami POSTGRESQL_* variables, so the settings go
        # through the server arguments; docker-entrypoint.sh prepends "postgres"
        # when the first argument starts with "-". Restarts the database.
        args:
          - "-c"
          - "shared_preload_libraries=pg_stat_statements"
          - "-c"
          - "pg_stat_statements.track=top"
          - "-c"
          - "pg_stat_statements.max=5000"
          - "-c"
          - "track_io_timing=on"
        podAnnotations:
          ad.datadoghq.com/postgresql.check_names: '["postgres"]'
          ad.datadoghq.com/postgresql.init_configs: '[{}]'
          ad.datadoghq.com/postgresql.instances: >-
            [{"host": "%%host%%", "port": 5432, "username": "ms-event", "password": "ENC[k8s_secret@prod/db-secrets/ms-event-password]", "dbname": "ms-event"}]
        persistence:
          storageClass: local-path
        resources:
          limits:
            cpu: 800m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        extraVolumes:
          - name: postgresql-run
            emptyDir: {}
        extraVolumeMounts:
          - name: postgresql-run
            mountPath: /var/run/postgresql
