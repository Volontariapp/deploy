apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: volontariapp-wildcard
  namespace: prod
spec:
  commonName: '*.cyrus-ag.com'
  dnsNames:
  - '*.cyrus-ag.com'
  - cyrus-ag.com
  issuerRef:
    kind: ClusterIssuer
    name: cloudflare-issuer
  secretName: volontariapp-wildcard-tls
  # Seul Certificate wildcard du cluster : un second (namespace traefik) demandait les memes noms
  # en DNS-01 et bloquait les renouvellements. Renouvellement 60 jours avant expiration
  # (certificats de 90 jours) pour disposer d'une longue fenetre de nouvelles tentatives.
  renewBefore: 1440h
