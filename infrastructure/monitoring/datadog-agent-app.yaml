apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: datadog-agent-install
  namespace: argocd
spec:
  project: default
  source:
    chart: datadog
    repoURL: https://helm.datadoghq.com
    targetRevision: 3.245.1
    helm:
      values: |
        datadog:
          apiKeyExistingSecret: datadog-keys
  destination:
    server: https://kubernetes.default.svc
    namespace: datadog
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
