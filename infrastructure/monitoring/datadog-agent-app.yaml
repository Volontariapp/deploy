apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: datadog-agent-install
  namespace: argocd
spec:
  project: default
  source:
    chart: datadog
    repoURL: https://helm.datadoghq.com
    targetRevision: 3.245.1
    helm:
      values: |
        datadog:
          apiKeyExistingSecret: datadog-keys
          kubeStateMetricsEnabled: true
          logs:
            enabled: false # TODO: Enable logs phase 3

        agents:
          containers:
            agent:
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: datadog
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
