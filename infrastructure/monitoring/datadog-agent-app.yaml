apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: datadog-agent-install
  namespace: argocd
spec:
  project: default
  source:
    chart: datadog
    repoURL: https://helm.datadoghq.com
    targetRevision: 3.245.1
    helm:
      values: |
        datadog:
          site: us5.datadoghq.com
          clusterName: volontariapp-cluster
          apiKeyExistingSecret: datadog-keys
          kubeStateMetricsEnabled: true
          
          otlp:
            receiver:
              protocols:
                grpc:
                  enabled: true
                  endpoint: "0.0.0.0:4317"
                  # useHostPort: true est activé par défaut par Datadog, ce qui expose le port 4317
          
          secretBackend:
            command: "/readsecret_multiple_providers.sh"
            enableGlobalPermissions: true
            
          logs:
            enabled: true
            containerCollectAll: true
            containerCollectUsingFiles: true

          # Exclusion des conteneurs système, agent, initContainers et bases de données brutes
          containerExcludeLogs: "name:datadog-agent image:.*datadog.* kube_namespace:kube-system kube_namespace:argocd kube_namespace:traefik kube_namespace:cert-manager kube_namespace:datadog name:wait-for-.* name:.*-postgresql name:.*redis.* name:.*neo4j.* image:.*postgres.* image:.*redis.* image:.*neo4j.*"

          # Inclusion explicite des namespaces applicatifs
          containerIncludeLogs: "kube_namespace:prod kube_namespace:dev"
        agents:
          containers:
            agent:
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: datadog
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
